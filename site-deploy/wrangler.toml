# Single-worker deploy: verdu.verdu-3a3.workers.dev serves the portfolio and
# the chat from ONE worker. Static files come from an R2 bucket (the Workers
# static-assets resolver of this account currently answers /api/* before the
# worker, so the site is served by code instead — same worker, R2-backed).
name = "verdu"
main = "src/site.ts"
compatibility_date = "2026-09-15"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "verdu-assets"

[vars]
# Same provider/limits contract as worker/wrangler.toml (production defaults).
AI_PROVIDER = "groq"
GROQ_MODEL_ID = "openai/gpt-oss-20b"
MODEL_ID = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GITHUB_REPO = ""
GITHUB_REF = "main"
GITHUB_TOKEN = ""
ALLOWED_ORIGINS = "http://localhost:4321;https://verdu.dev;https://verdu-dev.verdu-3a3.workers.dev;https://verdu.verdu-3a3.workers.dev"
RATE_LIMIT_PER_MINUTE = "30"
MAX_MESSAGES = "8"
MAX_INPUT_CHARS = "2000"
MAX_OUTPUT_TOKENS = "512"
MAX_TOOL_CALLS = "3"
DOC_MAX_CHARS = "6000"