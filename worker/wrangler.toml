name = "verdu-chat"
main = "src/index.ts"
compatibility_date = "2026-09-15"

[ai]
binding = "AI"

[vars]
MODEL_ID = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GITHUB_REPO = ""
GITHUB_REF = "main"
GITHUB_TOKEN = ""
ALLOWED_ORIGINS = "http://localhost:4321"
RATE_LIMIT_PER_MINUTE = "30"
MAX_MESSAGES = "8"
MAX_INPUT_CHARS = "2000"
MAX_OUTPUT_TOKENS = "512"
MAX_TOOL_CALLS = "3"
DOC_MAX_CHARS = "6000"

# Optional native rate limiting. Requires an account namespace (create one with
# `wrangler ratelimit create` and set namespace_id) and is optional: the worker
# falls back to an in-memory sliding window when this binding is absent.
# [[ratelimits]]
# binding = "RATE_LIMITER"
# namespace_id = "REPLACE_WITH_YOUR_NAMESPACE_ID"
# simple_limit = { limit = 30, period = 60 }