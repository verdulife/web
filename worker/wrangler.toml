name = "verdu-chat"
main = "src/index.ts"
compatibility_date = "2026-09-15"

[ai]
binding = "AI"

[vars]
# AI provider default. GEMINI_API_KEY is a SECRET and never lives here: local
# dev uses worker/.dev.vars (gitignored), production uses
# `wrangler secret put GEMINI_API_KEY`. The committed defaults select the Gemini
# provider (gemini-3.6-flash through the OpenAI-compatible endpoint). The other
# modes are CLI-only switches (`wrangler dev --var AI_PROVIDER:...`), never
# changed in this committed file:
#   mock       -> MockAIProvider (widget/UI testing, no model API)
#   cloudflare -> legacy Workers AI binding (env.AI)
AI_PROVIDER = "gemini"
MODEL_ID = "gemini-3.6-flash"
GITHUB_REPO = ""
GITHUB_REF = "main"
GITHUB_TOKEN = ""
ALLOWED_ORIGINS = "http://localhost:4321"
RATE_LIMIT_PER_MINUTE = "30"
MAX_MESSAGES = "8"
MAX_INPUT_CHARS = "2000"
MAX_OUTPUT_TOKENS = "512"
MAX_TOOL_CALLS = "3"
DOC_MAX_CHARS = "6000"

# Optional native rate limiting. Requires an account namespace (create one with
# `wrangler ratelimit create` and set namespace_id) and is optional: the worker
# falls back to an in-memory sliding window when this binding is absent.
# [[ratelimits]]
# binding = "RATE_LIMITER"
# namespace_id = "REPLACE_WITH_YOUR_NAMESPACE_ID"
# simple_limit = { limit = 30, period = 60 }