name = "verdu-chat"
main = "src/index.ts"
compatibility_date = "2026-09-15"

[ai]
binding = "AI"

[vars]
# AI provider default (production). API keys are SECRETS and never live here:
# local dev uses worker/.dev.vars (gitignored), production uses
# `wrangler secret put <KEY>`. The committed default is Groq (free tier, the
# most generous real cap); Gemini and the rest are CLI-only switches
# (`wrangler dev --var AI_PROVIDER:...`) or committed changes:
#   groq      -> GroqOpenAIProvider (default; GROQ_API_KEY secret, gpt-oss-20b)
#   gemini    -> GeminiOpenAIProvider (GEMINI_API_KEY secret, MODEL_ID)
#   mock      -> MockAIProvider (widget/UI testing, no model API)
#   guide     -> deterministic curated fallback (no LLM)
#   cloudflare-> legacy Workers AI binding (env.AI)
AI_PROVIDER = "groq"
GROQ_MODEL_ID = "openai/gpt-oss-20b"
MODEL_ID = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GITHUB_REPO = ""
GITHUB_REF = "main"
GITHUB_TOKEN = ""
ALLOWED_ORIGINS = "http://localhost:4321;https://verdu.dev;https://verdu-dev.verdu-3a3.workers.dev"
RATE_LIMIT_PER_MINUTE = "30"
MAX_MESSAGES = "8"
MAX_INPUT_CHARS = "2000"
MAX_OUTPUT_TOKENS = "512"
MAX_TOOL_CALLS = "3"
DOC_MAX_CHARS = "6000"

# Optional native rate limiting. Requires an account namespace (create one with
# `wrangler ratelimit create` and set namespace_id) and is optional: the worker
# falls back to an in-memory sliding window when this binding is absent.
# [[ratelimits]]
# binding = "RATE_LIMITER"
# namespace_id = "REPLACE_WITH_YOUR_NAMESPACE_ID"
# simple_limit = { limit = 30, period = 60 }